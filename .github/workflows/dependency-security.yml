name: Dependency security

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: [requirements.txt]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Audit proposed pins and determine eligibility
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          git show "${BASE_SHA}:.github/scripts/security_update.py" > "$RUNNER_TEMP/security_update.py"
          python "$RUNNER_TEMP/security_update.py"
      - run: |
          python -m pip install --only-binary=:all: -r requirements.txt
          python -m pip check
      - name: Exercise authentication and relay
        env:
          PYTHONPATH: ${{ github.workspace }}
          BEARER_TOKEN: test-key
          DEEPGRAM_API_KEY: test-deepgram
        run: python .github/scripts/test_runtime.py

